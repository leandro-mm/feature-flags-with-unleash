services:
  unleash-db:
    image: postgres:16-alpine
    container_name: unleash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    volumes:
      - unleash-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: unleash
    restart: unless-stopped
    depends_on:
      unleash-db:
        condition: service_healthy
    ports:
      - "4242:4242"
    environment:
      DATABASE_HOST: unleash-db
      DATABASE_PORT: 5432
      DATABASE_NAME: unleash
      DATABASE_USERNAME: unleash
      DATABASE_PASSWORD: unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4242/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  featureflag-api:
    build:
      context: .
      dockerfile: FeatureFlag.API/Dockerfile
    container_name: featureflag-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # If you don't want to commit secrets, set EBIRD__APIKEY_FILE via Docker secrets mapping
      # The application will read the API key from this file if EBird:ApiKey is not set.
      EBIRD__APIKEY_FILE: /run/secrets/ebird_api_key
    ports:
      - "5086:8080"
    secrets:
      - ebird_api_key

  featureflag-web:
    build:
      context: .
      dockerfile: FeatureFlag.Web/Dockerfile
    container_name: featureflag-web
    restart: unless-stopped
    depends_on:
      - featureflag-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5087:8080"

volumes:
  unleash-db-data:

secrets:
  ebird_api_key:
    file: ./secrets/ebird_api_key.txt
